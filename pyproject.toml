[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "awesome-datatable"
version = "0.1.0"
description = "A polars table filtered, sorted, and paged on the server and shown with htmx."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "jinja2>=3.1.6",
    "polars>=1.44.2",
]

[dependency-groups]
dev = [
    "playwright==1.63.0",
    "pytest==9.1.1",
    "pytest-playwright==0.9.0",
    "pytest-xdist==3.8.0",
    "ruff==0.16.7",
    "starlette==1.7.0",
    "uvicorn==0.54.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/awesome_datatable"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [".*", "tmp"]
# E2E tests drive the installed Chrome; select them with `-m e2e`.
addopts = ["-m", "not e2e", "--browser-channel", "chrome"]
markers = [
    "e2e: browser tests of the data table in the demo app (run with `-m e2e`)",
    "table_config(**changes): TableConfig fields that the demo app's table of an E2E test replaces",
]
