[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "awesome-datatable"
version = "0.1.0"
description = "A polars table filtered, sorted, and paged on the server and shown with htmx."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "jinja2>=3.1.6",
    "polars>=1.44.2",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/awesome_datatable"]

[tool.pytest.ini_options]
testpaths = ["tests"]
